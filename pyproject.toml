[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolforge"
version = "0.1.0"
description = "A developer-friendly Python framework for creating and exposing MCP tools with minimal boilerplate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ToolForge Contributors" }
]
dependencies = [
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/toolforge/toolforge"
Repository = "https://github.com/toolforge/toolforge"
Issues = "https://github.com/toolforge/toolforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toolforge"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []
