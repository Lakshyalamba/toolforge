[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcptoolforge"
version = "0.1.0"
description = "A developer-friendly Python framework for creating and exposing MCP tools with minimal boilerplate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MCPToolForge Contributors" }
]
dependencies = [
    "anyio>=4.0",
    "mcp>=2.0.0",
]

[project.scripts]
mcptoolforge = "mcptoolforge.cli.main:main"

[project.urls]
Homepage = "https://github.com/mcptoolforge/mcptoolforge"
Repository = "https://github.com/mcptoolforge/mcptoolforge"
Issues = "https://github.com/mcptoolforge/mcptoolforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcptoolforge"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = []
