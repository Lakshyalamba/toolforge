name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-typecheck:
    name: Code Quality (Lint, Format, Type Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dspy]"

      - name: Check code formatting with Ruff
        run: |
          ruff format --check .

      - name: Lint codebase with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy src/toolforge

  tests-with-dspy:
    name: Tests (Python ${{ matrix.python-version }} with DSPy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies with DSPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dspy]"

      - name: Run test suite with Pytest
        run: |
          pytest --durations=10

  tests-without-dspy:
    name: Tests (Python 3.11 without DSPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (Core & Dev only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests verifying clean fallback when DSPy is not installed
        run: |
          pytest

  build-check:
    name: Package Build & Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine hatchling

      - name: Build sdist and wheel artifacts
        run: |
          python -m build

      - name: Verify package metadata with Twine
        run: |
          twine check --strict dist/*
